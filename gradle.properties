org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# macOS / Apple Silicon toolchain. The android/ tree still carries the original
# Windows path (C:\Program Files\Eclipse Adoptium\...) which is why that build
# cannot run here as-is.
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home

android.useAndroidX=true
kotlin.code.style=official

# Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true

# --- On-device inference -----------------------------------------------------
# QNN/ExecuTorch needs real Snapdragon silicon (Hexagon NPU). Neither the
# Apple-silicon emulator nor an iPhone can run it, so it is off by default on
# this host. AiServiceFactory already falls back to StubAiService when the
# backend is unavailable, so the app runs fully except for on-device generation.
# Flip both to true only when building against a physical Snapdragon device
# with the AAR produced by runtime/scripts/build_android_aar.sh.
qnnVersion=2.37.0
executorchVersion=1.0.0
enableQnnBackend=false
useLocalAar=false
autoLoadQwen=false
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
